<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clavix social card</title>
<!-- Source of assets/social-card.png (1200x630). Render with:
     google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
       --screenshot=assets/social-card.png file://$PWD/.mockups/social-card.html -->
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../assets/fonts/inter-latin.woff2') format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url('../assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #f4f6f6; color: #16191a; font-family: Inter, sans-serif; font-feature-settings: "cv11","ss01","ss03";
  display: grid; grid-template-columns: 1fr 380px; position: relative;
}
.copy { padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
h1 { margin-top: auto; font-size: 66px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 700; max-width: 700px; }
h1 em { font-style: normal; color: #0f8b8d; }
.sub { margin-top: 26px; font-size: 25px; color: #2e3538; }
.facts { margin-top: 22px; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 20px; color: #4b5356; }
.side { background: #0b5c5e; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; gap: 10px; }
.tree { background: #f4f6f6; border-radius: 10px; padding: 14px 10px; font-size: 21px; }
.n { padding: 7px 12px; border-radius: 6px; display: flex; color: #16191a; }
.n.d1 { padding-left: 30px; } .n.d2 { padding-left: 56px; }
.n.on { background: #d4ecea; color: #0b5c5e; font-weight: 600; }
.sec { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; color: #5f696d; padding: 10px 12px 4px; }
.cap { color: #d4ecea; font-size: 18px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><svg width="56" height="56" viewBox="0 0 512 512"><circle cx="256" cy="256" r="218" fill="none" stroke="#0f8b8d" stroke-width="34" stroke-dasharray="17 11.6"/><circle cx="256" cy="256" r="200" fill="#0f8b8d"/><circle cx="256" cy="256" r="166" fill="none" stroke="#bfe9e4" stroke-width="8"/><path d="M336 182 A110 110 0 1 0 336 330" fill="none" stroke="#0b5c5e" stroke-width="60" transform="translate(7 8)"/><path d="M336 182 A110 110 0 1 0 336 330" fill="none" stroke="#fff" stroke-width="60"/></svg>Clavix</div>
    <h1>The <em>KeePassXC experience</em> for your Vaultwarden vault</h1>
    <p class="sub">A native desktop client for Vaultwarden &amp; Bitwarden.</p>
    <p class="facts">Linux · macOS · Windows · GPL-3.0 · clavix.org</p>
  </div>
  <div class="side">
    <div class="tree">
      <div class="sec">MY VAULT</div>
      <div class="n d1">▸ Internet</div>
      <div class="n d1 on">▾ Servers</div>
      <div class="n d2">Homelab</div>
      <div class="n d1">▸ Banking</div>
      <div class="sec">ORGANIZATIONS</div>
      <div class="n d1">▸ Family</div>
    </div>
    <p class="cap">Your folders, as a tree,<br>with drag &amp; drop.</p>
  </div>
</body>
</html>
